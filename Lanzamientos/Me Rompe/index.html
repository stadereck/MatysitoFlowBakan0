<style>
  :root{
    --bg: #121212;
    --panel: #0d0d0d;
    --line: rgba(255,255,255,0.12);
    --text: #ffffff;

    --green: #1ed760;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  a:focus-visible, button:focus-visible, select:focus-visible{
    outline:2px solid var(--green);
    outline-offset:2px;
    border-radius:2px;
  }
  .app{animation:fade-in .5s ease both;}
  @keyframes fade-in{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  body{
    background:linear-gradient(180deg, #4d4d4d 0%, #2c2c2c 32%, var(--bg) 62%, var(--bg) 100%);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .app{max-width:1000px;margin:0 auto;}

  /* ---------- HERO ---------- */
  .hero{
    padding:56px 40px 32px;
  }
  .hero-inner{display:flex; gap:24px; align-items:flex-end; flex-wrap:wrap;}

  .cover{
    width:212px; height:212px; flex-shrink:0;
    border-radius:4px;
    box-shadow:0 22px 55px rgba(0,0,0,0.55);
    overflow:hidden;
    background:#232325;
  }
  .cover img{
    width:100%; height:100%; object-fit:cover; display:block;
  }

  .meta{flex:1; min-width:280px; padding-bottom:2px;}
  .eyebrow{
    font-size:15px; font-weight:400; color:var(--text);
    margin:0 0 8px;
  }
  .title{
    font-weight:900;
    font-size:clamp(34px, 6vw, 72px);
    line-height:1.05;
    margin:0 0 18px;
    letter-spacing:-0.02em;
  }
  .artist-row{
    display:flex; align-items:center; gap:8px; margin-bottom:22px;
    font-size:15px; color:var(--text-dim); flex-wrap:wrap;
  }
  .artist-avatar{
    width:24px; height:24px; border-radius:50%; flex-shrink:0;
    background:#535353;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .artist-avatar svg{width:14px; height:14px; opacity:0.8;}
  .artist-link{
    color:var(--text); font-weight:700; text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .artist-link:hover{
    text-decoration:underline;
  }
  .dot{opacity:.8;}

  /* ---------- COUNTDOWN + COUNTRY ROW ---------- */
  .release-row{
    display:flex; gap:14px; flex-wrap:wrap; align-items:stretch;
  }

  .countdown{
    display:flex;
    background:var(--panel);
    border-radius:4px;
    overflow:hidden;
    transition:opacity .25s ease;
  }
  .countdown .cell{
    padding:14px 22px;
    text-align:center;
    min-width:64px;
    position:relative;
  }
  .countdown .cell + .cell::before{
    content:"";
    position:absolute; left:0; top:14px; bottom:14px;
    width:1px; background:rgba(255,255,255,0.18);
  }
  .countdown .num{
    font-size:28px; font-weight:700; font-variant-numeric:tabular-nums;
    color:var(--text);
    line-height:1;
  }
  .countdown .label{
    font-size:12px; color:var(--text-dim); margin-top:6px;
  }

  .live-badge{
    display:flex; align-items:center; gap:10px;
    background:var(--panel);
    border-radius:4px;
    padding:0 22px;
    color:var(--green);
    font-weight:700; font-size:14px;
  }
  .live-dot{
    width:8px; height:8px; border-radius:50%; background:var(--green);
    animation:live-pulse 1.8s infinite;
  }
  @keyframes live-pulse{
    0%   { box-shadow:0 0 0 0 rgba(30,215,96,0.55); }
    70%  { box-shadow:0 0 0 9px rgba(30,215,96,0); }
    100% { box-shadow:0 0 0 0 rgba(30,215,96,0); }
  }

  .country-card{
    background:var(--panel);
    border-radius:4px;
    padding:12px 18px;
    min-width:230px;
    display:flex; flex-direction:column; justify-content:center; gap:7px;
  }
  .country-card .q{
    font-size:12px; color:var(--text-dim);
  }
  .select-wrap{position:relative;}
  .select-wrap::after{
    content:"";
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    width:8px; height:8px;
    border-right:1.5px solid var(--text-dim);
    border-bottom:1.5px solid var(--text-dim);
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }
  .country-select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background:#2a2a2a;
    color:var(--text);
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 26px 8px 10px;
    font-size:13px;
    font-family:inherit;
    outline:none;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .country-select:hover{border-color:#8a8a8a; background:#323232;}
  .country-select:focus{border-color:var(--green); box-shadow:0 0 0 1px var(--green);}
  .country-result{
    font-size:12.5px; color:var(--text-dim); line-height:1.4;
  }
  .country-result b{color:var(--text); font-weight:600;}

  /* ---------- ACTIONS ---------- */
  .actions{
    padding:26px 40px; display:flex; align-items:center; gap:24px;
  }
  .play-btn{
    display:flex; align-items:center; justify-content:center;
    width:56px; height:56px; border-radius:50%;
    background:var(--green); color:#000000;
    text-decoration:none;
    cursor:pointer;
    animation: play-pulse 2.2s ease-out infinite;
    transition:transform .15s ease, background .15s ease;
  }
  .play-btn:hover{transform:scale(1.06); background:#22e065; animation-play-state:paused;}
  .play-btn svg{margin-left:3px;}
  @keyframes play-pulse{
    0%   { box-shadow:0 0 0 0 rgba(30,215,96,0.55); }
    70%  { box-shadow:0 0 0 16px rgba(30,215,96,0); }
    100% { box-shadow:0 0 0 0 rgba(30,215,96,0); }
  }
  .dots{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); cursor:default;
  }

  /* ---------- TRACKLIST ---------- */
  .tracklist{padding:8px 40px 60px;}
  .tracklist h2{font-size:22px; font-weight:700; margin:0 0 18px;}
  .tl-head{
    display:grid; grid-template-columns:36px 1fr 60px;
    gap:12px; padding:0 12px 8px; border-bottom:1px solid var(--line);
    color:var(--text-dim); font-size:13px;
  }
  .tl-row{
    display:grid; grid-template-columns:36px 1fr 60px;
    gap:12px; align-items:center; padding:12px;
    border-radius:4px;
  }
  .tl-row:hover{background:rgba(255,255,255,0.07);}
  .tl-idx{
    color:var(--text-dim); font-variant-numeric:tabular-nums;
    position:relative; width:16px; height:16px;
  }
  .tl-idx .idx-num{display:block;}
  .tl-idx .idx-play{
    display:none; align-items:center; justify-content:center;
    position:absolute; inset:0; color:var(--text);
  }
  .tl-row:hover .idx-num{display:none;}
  .tl-row:hover .idx-play{display:flex;}
  .tl-song .name{font-weight:400; font-size:16px; margin:0;}
  .tl-song .name a{color:var(--text); text-decoration:none;}
  .tl-song .name a:hover{text-decoration:underline;}
  .tl-song .by{font-size:14px; margin-top:2px;}
  .tl-song .by a{color:var(--text-dim); text-decoration:none;}
  .tl-song .by a:hover{color:var(--text); text-decoration:underline;}
  .tl-time{color:var(--text-dim); font-size:14px; text-align:right; font-variant-numeric:tabular-nums;}

  @media (max-width:560px){
    .hero{padding:36px 20px 24px;}
    .actions,.tracklist{padding-left:20px; padding-right:20px;}
  }
</style>

  const select = document.getElementById('country-select');
  COUNTRIES.forEach(([name, code, tz]) => {
    const opt = document.createElement('option');
    opt.value = tz;
    opt.textContent = name;
    opt.dataset.name = name;
    if (code === 'MX') opt.selected = true;
    select.appendChild(opt);
  });

  function pad(n){ return String(n).padStart(2,'0'); }

  // Diferencia (en minutos) entre la zona horaria elegida y la zona horaria
  // del propio navegador, calculada comparando cómo formatea cada una el
  // mismo instante. Con eso "reloqueamos" el countdown a la hora local del
  // país elegido, aunque el instante real de estreno sigue siendo el mismo.
  function tzOffsetMinutes(date, timeZone){
    const dtf = new Intl.DateTimeFormat('en-US', {
      timeZone, hourCycle:'h23',
      year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', second:'2-digit'
    });
    const parts = dtf.formatToParts(date).reduce((acc,p)=>{acc[p.type]=p.value; return acc;},{});
    const asUTC = Date.UTC(parts.year, parts.month-1, parts.day, parts.hour, parts.minute, parts.second);
    return (asUTC - date.getTime()) / 60000;
  }

  let selectedTz = select.value; // 'America/Mexico_City' por defecto

  const resultEl = document.getElementById('country-result');
  const dateLineEl = document.getElementById('date-line');
  const countdownEl = document.getElementById('countdown');
  const liveBadgeEl = document.getElementById('live-badge');

  function diffForSelected(now){
    // Diferencia entre la zona del país elegido y la zona local del navegador,
    // aplicada a "ahora" para saber qué hora es "ahora" en ese país,
    // y así contamos hacia el mismo instante de estreno pero visto desde esa zona.
    const nowLocalOffset = -now.getTimezoneOffset(); // min respecto a UTC, zona del navegador
    const nowTargetOffset = tzOffsetMinutes(now, selectedTz); // min respecto a UTC, país elegido
    const shiftMs = (nowTargetOffset - nowLocalOffset) * 60000;
    const nowShifted = now.getTime() + shiftMs;
    return RELEASE_UTC - nowShifted; // negativo = ya se lanzó ahí
  }

  function updateCountryLabel(rawDiff){
    const opt = select.options[select.selectedIndex];
    const name = opt.dataset.name;
    let formatted;
    try {
      formatted = new Intl.DateTimeFormat('es-MX', {
        timeZone: selectedTz, day:'numeric', month:'long',
        hour:'numeric', minute:'2-digit', hour12:true
      }).format(new Date(RELEASE_UTC));
    } catch(e){
      formatted = '12 de julio, 9:00 p. m.';
    }
    const verb = rawDiff <= 0 ? 'salió' : 'se estrena';
    resultEl.innerHTML = 'En <b>' + name + '</b> ' + verb + ' el ' + formatted + '.';
  }

  function tick(){
    const now = new Date();
    const rawDiff = diffForSelected(now);
    const launched = rawDiff <= 0;
    const diff = launched ? 0 : rawDiff;

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    document.getElementById('cd-days').textContent = pad(days);
    document.getElementById('cd-hours').textContent = pad(hours);
    document.getElementById('cd-mins').textContent = pad(mins);
    document.getElementById('cd-secs').textContent = pad(secs);

    // ---- Countdown vs. badge "Ya disponible" ----
    countdownEl.hidden = launched;
    liveBadgeEl.hidden = !launched;

    // ---- "Se publica" -> "Se publicó" cuando ya salió en el país elegido ----
    dateLineEl.textContent = launched
      ? 'Se publicó el 12 de julio de 2026'
      : 'Se publica el 12 de julio de 2026';

    // ---- Título de la pestaña ----
    document.title = launched
      ? 'Me Rompe — MatysitoFlowBakan0 Escuchala ya!'
      : 'Me Rompe — MatysitoFlowBakan0 (Pre Lanzamiento)';

    updateCountryLabel(rawDiff);
  }

  select.addEventListener('change', () => {
    selectedTz = select.value;
    tick();
  });

  tick();
  setInterval(tick, 1000);
</script>
