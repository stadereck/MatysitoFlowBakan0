<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Me Rompe — MatysitoFlowBakan0 (Pre Lanzamiento)</title>
<style>
  :root{
    --bg: #121212;
    --panel: #0d0d0d;
    --line: rgba(255,255,255,0.12);
    --text: #ffffff;
    --text-dim: #a7a7a7;
    --green: #1ed760;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .app{max-width:1000px;margin:0 auto;}

  /* ---------- HERO ---------- */
  .hero{
    padding:56px 40px 32px;
    background:linear-gradient(180deg, #4d4d4d 0%, #2c2c2c 55%, var(--bg) 100%);
  }
  .hero-inner{display:flex; gap:24px; align-items:flex-end; flex-wrap:wrap;}

  .cover{
    width:212px; height:212px; flex-shrink:0;
    border-radius:4px;
    box-shadow:0 22px 55px rgba(0,0,0,0.55);
    overflow:hidden;
    background:linear-gradient(160deg,#3a3a3c 0%,#232325 100%);
    display:flex; align-items:center; justify-content:center;
  }

  .meta{flex:1; min-width:280px; padding-bottom:2px;}
  .eyebrow{
    font-size:15px; font-weight:400; color:var(--text);
    margin:0 0 8px;
  }
  .title{
    font-weight:900;
    font-size:clamp(34px, 6vw, 72px);
    line-height:1.05;
    margin:0 0 18px;
    letter-spacing:-0.02em;
  }
  .artist-row{
    display:flex; align-items:center; gap:8px; margin-bottom:22px;
    font-size:15px; color:var(--text-dim); flex-wrap:wrap;
  }
  .artist-avatar{
    width:24px; height:24px; border-radius:50%; flex-shrink:0;
    background:#535353;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .artist-avatar svg{width:14px; height:14px; opacity:0.8;}
  .artist-link{
    color:var(--text); font-weight:700; text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .artist-link:hover{
    text-decoration:underline;
  }
  .dot{opacity:.8;}

  /* ---------- COUNTDOWN + COUNTRY ROW ---------- */
  .release-row{
    display:flex; gap:14px; flex-wrap:wrap; align-items:stretch;
  }

  .countdown{
    display:flex;
    background:var(--panel);
    border-radius:4px;
    overflow:hidden;
  }
  .countdown .cell{
    padding:14px 22px;
    text-align:center;
    min-width:64px;
    position:relative;
  }
  .countdown .cell + .cell::before{
    content:"";
    position:absolute; left:0; top:14px; bottom:14px;
    width:1px; background:rgba(255,255,255,0.18);
  }
  .countdown .num{
    font-size:28px; font-weight:700; font-variant-numeric:tabular-nums;
    color:var(--text);
    line-height:1;
  }
  .countdown .label{
    font-size:12px; color:var(--text-dim); margin-top:6px;
  }

  .country-card{
    background:var(--panel);
    border-radius:4px;
    padding:12px 18px;
    min-width:230px;
    display:flex; flex-direction:column; justify-content:center; gap:7px;
  }
  .country-card .q{
    font-size:12px; color:var(--text-dim);
  }
  .country-select{
    width:100%;
    background:#2a2a2a;
    color:var(--text);
    border:1px solid var(--line);
    border-radius:4px;
    padding:7px 8px;
    font-size:13px;
    font-family:inherit;
    outline:none;
  }
  .country-select:focus{border-color:#7a7a7a;}
  .country-result{
    font-size:12.5px; color:var(--text-dim); line-height:1.4;
  }
  .country-result b{color:var(--text); font-weight:600;}

  /* ---------- ACTIONS ---------- */
  .actions{
    padding:26px 40px; display:flex; align-items:center; gap:24px;
  }
  .presave{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--green); color:#000000;
    border:none; border-radius:500px;
    padding:14px 30px;
    font-size:16px; font-weight:700;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .presave:hover{transform:scale(1.03); background:#22e065;}
  .presave.saved{background:#121212; color:var(--green); border:1px solid #535353;}
  .presave .icon-circle{
    width:22px; height:22px; border-radius:50%;
    border:2px solid currentColor;
    display:flex; align-items:center; justify-content:center;
  }
  .dots{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); cursor:default;
  }

  /* ---------- TRACKLIST ---------- */
  .tracklist{padding:8px 40px 60px;}
  .tracklist h2{font-size:22px; font-weight:700; margin:0 0 18px;}
  .tl-head{
    display:grid; grid-template-columns:36px 1fr 60px;
    gap:12px; padding:0 12px 8px; border-bottom:1px solid var(--line);
    color:var(--text-dim); font-size:13px;
  }
  .tl-row{
    display:grid; grid-template-columns:36px 1fr 60px;
    gap:12px; align-items:center; padding:12px;
    border-radius:4px;
  }
  .tl-row:hover{background:rgba(255,255,255,0.07);}
  .tl-idx{color:var(--text-dim); font-variant-numeric:tabular-nums;}
  .tl-song .name{font-weight:400; font-size:16px; color:var(--text);}
  .tl-song .by{font-size:14px; color:var(--text-dim); margin-top:2px;}
  .tl-time{color:var(--text-dim); font-size:14px; text-align:right; font-variant-numeric:tabular-nums;}

  @media (max-width:560px){
    .hero{padding:36px 20px 24px;}
    .actions,.tracklist{padding-left:20px; padding-right:20px;}
  }
</style>
</head>

    select.appendChild(opt);

    const tz = opt.value;
    const name = opt.dataset.name;
    const releaseDate = new Date(RELEASE_UTC);
    let formatted;
    try {

        day: 'numeric',
